<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; manifest-src 'self' data: blob:; connect-src 'none'; worker-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="БИО-ФОРМА">
<title>БИО-ФОРМА 14.0</title>
<style>
/* =========================================================
   БИО-ФОРМА 14.0 — дизайн-система
   Две темы на одних токенах. Цвета только через переменные.
   ========================================================= */
:root{
  --bg:#0b0e12;--glow:rgba(36,179,216,.11);
  --surface:#131920;--surface-2:#1a212a;--surface-3:#232c37;--input:#0e1318;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);
  --text:#eef3f7;--text-2:#b4bfc9;--muted:#7e8a97;
  --accent:#24b3d8;--accent-2:#6fd6ef;--accent-ink:#6fd6ef;--accent-deep:#137f9c;--accent-glow:rgba(36,179,216,.42);--accent-soft:rgba(36,179,216,.14);--accent-line:rgba(36,179,216,.42);--on-accent:#03161d;
  --ok:#3fd27f;--ok-soft:rgba(63,210,127,.12);--ok-line:rgba(63,210,127,.38);
  --warn:#f2b553;--warn-soft:rgba(242,181,83,.12);--warn-line:rgba(242,181,83,.4);--warn-ink:#f6e3bf;
  --bad:#f07068;--bad-soft:rgba(240,112,104,.12);--bad-line:rgba(240,112,104,.42);
  --prot:#3dbde6;--fat:#f2b05a;--carb:#a58bf7;--water:#4ea7ff;--sleep:#9a8cf5;--gold:#f2c25a;
  --fig-bg:#080b0e;--fig-sil:#141c24;--fig-line:#34424f;--fig-off:#26323e;--fig-off-h:#30404e;--fig-cap:#586673;
  --sh-1:0 1px 0 rgba(255,255,255,.03) inset,0 10px 28px rgba(0,0,0,.28);
  --sh-2:0 22px 50px rgba(0,0,0,.55);
  --r-xl:28px;--r-lg:22px;--r-md:16px;--r-sm:12px;
  --tab-h:72px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f2f4f7;--glow:rgba(10,148,187,.10);
  --surface:#ffffff;--surface-2:#f4f6f9;--surface-3:#e8ecf1;--input:#f4f6f9;
  --line:rgba(16,32,48,.08);--line-2:rgba(16,32,48,.15);
  --text:#0e1a24;--text-2:#3f4c58;--muted:#606c79;
  --accent:#0a94bb;--accent-2:#14a6cf;--accent-ink:#0782a5;--accent-deep:#087a9b;--accent-glow:rgba(10,148,187,.3);--accent-soft:rgba(10,148,187,.10);--accent-line:rgba(10,148,187,.38);--on-accent:#ffffff;
  --ok:#1c9a52;--ok-soft:rgba(28,154,82,.10);--ok-line:rgba(28,154,82,.35);
  --warn:#c27a0c;--warn-soft:rgba(194,122,12,.10);--warn-line:rgba(194,122,12,.35);--warn-ink:#7a4d06;
  --bad:#d4433a;--bad-soft:rgba(212,67,58,.09);--bad-line:rgba(212,67,58,.35);
  --prot:#0a94bb;--fat:#d4891b;--carb:#7a5cf0;--water:#2f80ed;--sleep:#6c5ce7;--gold:#c99212;
  --fig-bg:#faf6f1;--fig-sil:#ead9c5;--fig-line:#c7a988;--fig-off:#dcc4a8;--fig-off-h:#d0b392;--fig-cap:#a8927a;
  --sh-1:0 1px 2px rgba(16,32,48,.05),0 10px 28px rgba(16,32,48,.06);
  --sh-2:0 24px 50px rgba(16,32,48,.18);
  color-scheme:light;
}

/* ---------- основа ---------- */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif;color:var(--text);display:flex;justify-content:center;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
b,strong{font-weight:650}
.app{width:100%;max-width:480px;min-height:100vh;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(var(--tab-h) + 34px + env(safe-area-inset-bottom,0px));background:radial-gradient(120% 420px at 50% -60px,var(--glow),transparent 70%)}
.ico{display:inline-flex;width:1.25em;height:1.25em;flex-shrink:0}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num-t,.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ---------- шапка ---------- */
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.hd-date{display:flex;align-items:center;gap:2px;color:var(--text-2);font-size:14.5px;font-weight:550;min-width:0;flex:1}
.hd-date button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.hd-date button:disabled{opacity:.25}
.hd-date span{padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hd-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
@media (max-width:374px){.hd-date{font-size:13.5px}.hd-date button{width:28px}.hd{gap:6px}}
.streak{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 11px 0 9px;border-radius:17px;background:var(--warn-soft);color:var(--gold);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.streak .ico{width:17px;height:17px}
.streak.zero{background:var(--surface-2);color:var(--muted)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,var(--accent),var(--accent-deep));color:#fff;font-weight:750;font-size:15px;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent-line)}
.avatar .ico{width:19px;height:19px}
.avatar.pro{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--gold)}
.ttl{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:8px 0 14px}
.ttl h1{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.6px}
.ttl small{display:block;font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-bottom:4px}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
h2{font-size:13px;font-weight:650;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px}
h3{font-size:17px;font-weight:700;letter-spacing:-.2px}

/* ---------- карточки, текст ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:16px;margin-bottom:12px}
.card p{font-size:14.5px;line-height:1.5;color:var(--text-2)}
.card p small{display:block;font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{display:flex;align-items:center;gap:8px}
.card-h h3 .ico{color:var(--accent-ink)}
.card-h .lnk2{font-size:13.5px;font-weight:650;color:var(--accent-ink);display:inline-flex;align-items:center;gap:2px}
.sec{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.2px;margin:20px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.sec button{color:var(--accent-ink);font-weight:650;font-size:13px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
.grid2 .card{margin:0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.num{font-size:28px;font-weight:750;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.num small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px;letter-spacing:0}
.cap{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.45}
.muted{color:var(--muted)}
.bar{height:6px;border-radius:4px;background:var(--surface-3);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:4px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.bar.warn-bar i{background:var(--warn)}
.bar.over-bar i{background:var(--bad)}
.lnk{background:none;border:0;padding:0;color:var(--accent-ink);font:inherit;font-weight:650;text-decoration:none;cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--surface-3);color:var(--text-2)}
.pill.pro{background:linear-gradient(135deg,#f6d27a,#e3a93b);color:#3a2600;letter-spacing:.3px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* ---------- кнопки ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:12px 16px;border-radius:16px;font-weight:650;font-size:15px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--text);margin-top:10px;text-align:center;transition:transform .12s,background .2s}
.btn:active{transform:scale(.98)}
.btn.main,.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border:none;box-shadow:0 10px 22px color-mix(in srgb,var(--accent) 25%,transparent)}
:root[data-theme="light"] .btn.main,:root[data-theme="light"] .btn.primary{box-shadow:0 10px 22px color-mix(in srgb,var(--accent) 22%,transparent)}
.btn.ghost{background:none;border-color:var(--line-2)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.btn.danger{border-color:var(--bad-line);color:var(--bad);background:var(--bad-soft)}
.btn.gold{background:linear-gradient(135deg,#f6d27a,#e3a93b);color:#2e1f00;border:none;box-shadow:0 10px 24px rgba(227,169,59,.28)}
.btn.sm{min-height:40px;padding:8px 12px;font-size:13.5px;border-radius:13px;width:auto}
.btn:disabled{opacity:.4}
.btn .ico{width:19px;height:19px}
.row2{display:grid;grid-template-columns:1fr auto;gap:8px}.row2 .btn{margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.three .inp{margin-top:4px}
.two>label.cap,.three>label.cap{display:flex;flex-direction:column;justify-content:flex-end}

/* ---------- поля, чипы, сегменты ---------- */
.inp{width:100%;background:var(--input);border:1px solid var(--line-2);color:var(--text);padding:12px 13px;border-radius:13px;font-size:16px;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp::placeholder{color:var(--muted)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{padding:8px 13px;min-height:38px;display:inline-flex;align-items:center;gap:6px;border-radius:19px;font-size:13.5px;font-weight:600;color:var(--text-2);background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;transition:background .2s,color .2s}
.chip.on{color:var(--accent-ink);background:var(--accent-soft);border-color:var(--accent-line)}
.chip.sec{color:var(--text-2);border-style:dashed}
.chip.add{border-style:dashed;border-color:var(--accent-line);color:var(--accent-ink);background:none}
.chip .ck{color:var(--muted);font-size:12px;margin-left:2px;font-weight:550}
.chip .ico{width:16px;height:16px}
.chip.fv{display:inline-flex;align-items:center;padding:0}.chip.fv button{padding:8px 10px;color:inherit}
.chip.cy{display:inline-flex;align-items:center;gap:6px}
.seg{display:flex;gap:4px;padding:4px;border-radius:15px;background:var(--surface-2);border:1px solid var(--line);margin:0 0 12px}
.seg button{flex:1;min-height:38px;padding:7px 6px;border-radius:11px;font-size:13.5px;font-weight:650;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
:root[data-theme="dark"] .seg button.on,:root:not([data-theme]) .seg button.on{background:var(--surface-3)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:4px 0 8px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line)}
.seg2 button{padding:8px 4px;border-radius:10px;font-size:13px;font-weight:650;color:var(--muted)}.seg2 button.on{background:var(--accent-soft);color:var(--accent-ink)}
.chips.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:15px;background:var(--surface-2);border:1px solid var(--line)}
.chips.seg4 .chip{justify-content:center;text-align:center;padding:7px 2px;line-height:1.2;font-size:12.5px;border:none;background:none;border-radius:11px;min-height:36px;white-space:normal}
.chips.seg4 .chip.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.16)}
:root:not([data-theme="light"]) .chips.seg4 .chip.on{background:var(--surface-3)}
#fMode{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:15px;background:var(--surface-2);border:1px solid var(--line)}
#fMode:has(.chip:nth-child(4)){grid-template-columns:repeat(4,1fr)}
#fSlots{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
#fMode .chip,#fSlots .chip{justify-content:center;text-align:center;padding:7px 2px;line-height:1.2;font-size:12px;white-space:normal}
#fMode .chip{border:none;background:none;border-radius:11px}
#fMode .chip.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.16)}
:root:not([data-theme="light"]) #fMode .chip.on{background:var(--surface-3)}
.sug{max-height:240px;overflow-y:auto;margin-top:6px;background:var(--surface);border:1px solid var(--accent-line);border-radius:14px;box-shadow:var(--sh-2)}
.sug button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;padding:11px 13px;font-size:14px;text-align:left;border-bottom:1px solid var(--line)}
.sug small,.li small{color:var(--muted);font-size:12px}
.sug .cap{padding:12px}
.wrow{display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px;font-size:14px;color:var(--text-2)}
.gin{display:flex;align-items:center;gap:6px;background:var(--input);border:1px solid var(--accent-line);border-radius:12px;padding:5px 11px}
.gin input{width:72px;background:none;border:none;color:var(--accent-ink);font-size:18px;font-weight:750;text-align:right;outline:none}
.vrow{margin-top:8px;font-size:13px;color:var(--muted)}
.vrow.ex{display:flex;justify-content:space-between;align-items:center}
.stp{display:flex;align-items:center;gap:8px}.stp b{font-size:13px;color:var(--text)}
.stp button{width:40px;height:40px;border-radius:11px;background:var(--surface-3);color:var(--accent-ink);display:grid;place-items:center}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:12px}
.step button{width:48px;height:44px;border-radius:11px;background:var(--surface-3);display:grid;place-items:center;color:var(--accent-ink)}
.step.two-b{gap:4px}.step.two-b button{flex:1;width:auto}
.step b{font-size:16px;text-align:center;min-width:0}

/* ---------- плашки ---------- */
.prev{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:16px;padding:13px;font-size:14px;line-height:1.5;margin-top:12px;color:var(--text)}
.prev small{display:block;color:var(--muted);font-size:12.5px;margin-top:6px;line-height:1.45}
.prev.warn2{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn-ink)}
.prev.danger2{background:var(--bad-soft);border-color:var(--bad-line);color:var(--text)}
.warn{background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.45;margin-bottom:12px}
.stop-badge,.warn-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.4px;padding:3px 9px;border-radius:8px;margin-bottom:6px}
.stop-badge{color:var(--bad);background:var(--bad-soft)}.warn-badge{color:var(--warn);background:var(--warn-soft)}
.day-banner{display:flex;align-items:center;gap:10px;background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:16px;padding:10px 12px;font-size:13.5px;line-height:1.4;margin:0 0 12px}
.day-banner .ico{color:var(--warn);flex:0 0 auto}.day-banner span{flex:1}
.day-banner button{flex-shrink:0;font-weight:700;font-size:13px;color:#1d1300;background:var(--warn);border-radius:11px;padding:8px 11px;min-height:36px}
.goal-banner{background:var(--bad-soft);border-color:var(--bad-line);color:var(--text)}
.goal-banner .ico{color:var(--bad)}.goal-banner button{background:var(--bad);color:#fff}
.bkp-banner{display:flex;flex-direction:column;gap:8px;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:18px;padding:12px 14px;margin-bottom:12px;font-size:13.5px;color:var(--text)}
.bkp-banner b{color:var(--accent-ink)}
details.more{margin-top:8px}
details.more summary{list-style:none;cursor:pointer;font-size:13px;color:var(--accent-ink);font-weight:650;display:inline-flex;align-items:center;gap:4px;padding:4px 0}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:'▾';font-size:10px;transition:transform .2s}
details.more[open] summary::after{transform:rotate(180deg)}
details.more small{display:block;font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:4px}

/* ---------- нижняя панель ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 20px);max-width:460px;height:var(--tab-h);display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;padding:6px;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;box-shadow:var(--sh-2);z-index:30}
.tabbar>button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:100%;border-radius:20px;color:var(--muted);font-size:11px;font-weight:650;transition:color .2s}
.tabbar>button .ico{width:23px;height:23px}
.tabbar>button.on{color:var(--accent-ink)}
.tabbar>button.on .ico svg{stroke-width:2.2}
.tabbar .fab{width:60px;height:60px;margin:-26px auto 0;border-radius:50%;background:linear-gradient(140deg,var(--accent-2),var(--accent) 55%,var(--accent-deep));color:#fff;box-shadow:0 12px 26px var(--accent-glow),0 0 0 5px var(--bg);display:grid;place-items:center;gap:0;transition:transform .15s}
.tabbar .fab .ico{width:28px;height:28px}.tabbar .fab .ico svg{stroke-width:2.4}
.tabbar .fab:active{transform:scale(.94)}
.tabbar .fab.open{transform:rotate(45deg)}

/* ---------- лист снизу ---------- */
.sheet-ov{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,6,10,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadeIn .2s ease-out}
:root[data-theme="light"] .sheet-ov{background:rgba(16,26,36,.35)}
.sheet{width:100%;max-width:480px;max-height:calc(100vh - 36px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--surface);border-radius:28px 28px 0 0;border:1px solid var(--line);border-bottom:none;box-shadow:var(--sh-2);animation:sheetUp .28s cubic-bezier(.2,.9,.25,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.tall{height:calc(100vh - 36px - env(safe-area-inset-top,0px))}
.sh-grab{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:9px auto 4px;flex-shrink:0}
.sh-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 18px 10px;flex-shrink:0}
.sh-top h3{font-size:19px}
.sh-x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2)}
.sh-body{overflow-y:auto;padding:0 18px 22px;-webkit-overflow-scrolling:touch;flex:1}
.sh-foot{padding:10px 18px 14px;border-top:1px solid var(--line);flex-shrink:0;background:var(--surface)}
.sh-foot .btn{margin-top:0}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-ov{animation:none}}

/* ---------- тост ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:min(440px,calc(100% - 32px));display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-2);color:var(--text);padding:12px 14px;border-radius:18px;font-size:14px;line-height:1.35;z-index:99;box-shadow:var(--sh-2);animation:toastIn .22s ease-out}
.toast-t{flex:1;min-width:0}.toast-t small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.toast-undo{color:var(--accent-ink);font-weight:750;font-size:13.5px;padding:6px 4px 6px 12px;border-left:1px solid var(--line-2);white-space:nowrap}
.toast.cele{border-color:var(--warn-line);animation:toastIn .22s ease-out,celePop .6s ease-out .05s}
.toast-ic{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--warn-soft);color:var(--gold);flex-shrink:0}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes celePop{0%{box-shadow:0 0 0 0 rgba(242,194,90,.5),var(--sh-2)}100%{box-shadow:0 0 0 18px rgba(242,194,90,0),var(--sh-2)}}
@media (prefers-reduced-motion:reduce){.toast,.toast.cele{animation:none}}

/* ---------- окна ---------- */
.modal-ov{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 28px}
.ask-ov{background:rgba(3,6,10,.6);align-items:center;z-index:95;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:20px 18px;box-shadow:var(--sh-2)}
.ask-card p{margin:0 0 16px;line-height:1.5;font-size:15.5px;color:var(--text)}
.ask-btns{display:flex;flex-direction:column;gap:8px}.ask-btns .btn{margin:0}

/* ---------- неделя ---------- */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 14px}
.wk-day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:15px;color:var(--muted);min-height:58px;border:1px solid transparent}
.wk-day small{font-size:11.5px;font-weight:600;text-transform:lowercase}
.wk-day b{font-size:17px;color:var(--text-2);font-weight:650;font-variant-numeric:tabular-nums}
.wk-day i{display:flex;gap:3px;height:5px}
.wk-day em{width:5px;height:5px;border-radius:50%}
.wk-day em.f{background:var(--accent)}.wk-day em.w{background:var(--gold)}
.wk-day.today b{color:var(--accent-ink)}
.wk-day.on{background:var(--surface);border-color:var(--line-2);box-shadow:var(--sh-1)}
.wk-day.on b{color:var(--text)}
.wk-day:disabled{opacity:.3}

/* ---------- главная: кольцо и БЖУ ---------- */
.hero{padding:18px}
.hero-row{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:148px;height:148px;flex-shrink:0;cursor:pointer}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rg-bg{fill:none;stroke:var(--surface-3);stroke-width:12}
.rg-fg{fill:none;stroke:url(#rgG);stroke-width:12;stroke-linecap:round;transition:stroke-dasharray .7s cubic-bezier(.2,.8,.2,1)}
.ring.anim .rg-fg{animation:rgIn 1.1s cubic-bezier(.2,.8,.2,1)}@keyframes rgIn{from{stroke-dasharray:0 400}}
@media (prefers-reduced-motion:reduce){.ring.anim .rg-fg{animation:none}}
.ring.near .rg-fg{stroke:var(--warn)}.ring.over .rg-fg{stroke:var(--bad)}
.rg-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px}
.rg-c b{font-size:36px;font-weight:800;letter-spacing:-1.2px;line-height:1;font-variant-numeric:tabular-nums}
.rg-c span{font-size:12px;color:var(--muted);margin-top:5px;font-weight:550;line-height:1.2}
.ring.over .rg-c b{color:var(--bad)}
.mac{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.mac-r{display:block;width:100%;text-align:left}
.mac-r .mt{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.mac-r .mt b{font-size:15px;color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.mac-r .mt b small{font-size:12px;color:var(--muted);font-weight:550}
.mac-r .bar{height:7px;margin-top:6px}
.mac-r.p .bar i{background:var(--prot)}.mac-r.f .bar i{background:var(--fat)}.mac-r.c .bar i{background:var(--carb)}
.mac-r.p .mt span{color:var(--text-2)}
.hero-st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.hero-st div{text-align:center}
.hero-st span{display:block;font-size:12px;color:var(--muted);font-weight:550}
.hero-st b{display:block;font-size:17px;font-weight:750;margin-top:2px;font-variant-numeric:tabular-nums}
.hero-st b.pos{color:var(--ok)}.hero-st b.dim{color:var(--muted);font-weight:550}

/* ---------- главная: следующий шаг ---------- */
.coach{position:relative;overflow:hidden;background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 16%,var(--surface)),var(--surface) 62%);border-color:var(--accent-line)}
.coach-k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:750;letter-spacing:.5px;text-transform:uppercase;color:var(--accent-ink)}
.coach-k .ico{width:15px;height:15px}
.coach h3{font-size:19px;margin:6px 0 4px;line-height:1.25}
.coach p{font-size:14.5px;color:var(--text-2);line-height:1.45}
.coach .acts2{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.coach .acts2 .btn{margin:0;justify-content:flex-start;text-align:left;min-height:48px}
.coach .acts2 .btn .k{margin-left:auto;font-size:13px;font-weight:650;opacity:.85;white-space:nowrap}
.coach .hide{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.coach.done{background:linear-gradient(150deg,color-mix(in srgb,var(--ok) 15%,var(--surface)),var(--surface) 62%);border-color:var(--ok-line)}
.coach.done .coach-k{color:var(--ok)}

/* ---------- главная: привычки ---------- */
.hab{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:13px 13px 12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);text-align:left;min-width:0;position:relative}
.hab .hk{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:650;color:var(--muted)}
.hab .hk .ico{width:16px;height:16px}
.hab.w .hk .ico{color:var(--water)}.hab.s .hk .ico{color:var(--sleep)}.hab.kg .hk .ico{color:var(--accent-ink)}
.hab b{font-size:21px;font-weight:750;letter-spacing:-.4px;font-variant-numeric:tabular-nums;margin-top:3px}
.hab b small{font-size:12px;color:var(--muted);font-weight:550;letter-spacing:0;margin-left:2px}
.hab .bar{width:100%;height:5px;margin-top:8px}
.hab.w .bar i{background:var(--water)}.hab.s .bar i{background:var(--sleep)}
.hab .hp{position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)}
.hab .hp .ico{width:16px;height:16px}
.hab .hs{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.3}

/* ---------- главная: восстановление ---------- */
.recov{display:flex;gap:12px;align-items:center;cursor:pointer}
.recov .fig{width:118px;flex-shrink:0;border-radius:16px;background:var(--fig-bg);border:1px solid var(--line);padding:6px 2px 0;pointer-events:none}
.recov .fig .bm-cap{display:none}
.recov .rl{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.rg{display:flex;flex-direction:column;gap:3px}
.rg span{font-size:12px;font-weight:650;color:var(--muted)}
.rg b{font-size:14px;font-weight:600;line-height:1.35}
.rg.ok b{color:var(--ok)}.rg.wait b{color:var(--warn)}
.rg em{font-style:normal;font-size:12.5px;color:var(--text-2)}

/* ---------- главная/питание: приёмы пищи ---------- */
.meals .ml{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.meals .ml:first-of-type{border-top:0;padding-top:2px}
.ml .mi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface-2);font-size:19px;flex-shrink:0}
.ml .mx{flex:1;min-width:0}
.ml .mx b{display:block;font-size:15px}
.ml .mx small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml .mk{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-2)}
.ml .mp{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);flex-shrink:0}
.ml .mp .ico{width:19px;height:19px}

/* ---------- итоги недели ---------- */
.wrec{border-color:var(--warn-line);background:linear-gradient(150deg,color-mix(in srgb,var(--gold) 12%,var(--surface)),var(--surface) 70%)}
.wrec-h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--gold);font-weight:700}.wrec-h span{display:flex;align-items:center;gap:6px}.wrec-h button{color:var(--muted);padding:4px}
.wrec-t{font-size:20px;font-weight:750;margin:8px 0 12px;letter-spacing:-.3px}
.wrec-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wrec-g div{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.wrec-g b{display:block;font-size:18px;font-weight:750}.wrec-g span{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}

/* ---------- быстрые действия ---------- */
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:96px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;font-weight:650;color:var(--text)}
.qa .qi{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff}
.qa .qi .ico{width:24px;height:24px}
.qa.food .qi{background:linear-gradient(140deg,#2bc0e4,#1585a8)}.qa.water .qi{background:linear-gradient(140deg,#5fb2ff,#2f74d8)}
.qa.wt .qi{background:linear-gradient(140deg,#3fd27f,#1f9a59)}.qa.tr .qi{background:linear-gradient(140deg,#f2b553,#d9822b)}
.qa.sl .qi{background:linear-gradient(140deg,#a596ff,#6d5ce6)}.qa.ms .qi{background:linear-gradient(140deg,#f0849d,#d65272)}

/* ---------- поиск еды ---------- */
.fs-search{position:relative;margin:2px 0 10px}
.fs-search .inp{padding-left:42px;font-size:16.5px;min-height:50px;border-radius:15px}
.fs-search>.ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:20px;height:20px}
.fs-search .fs-clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.fs-sec{font-size:12.5px;font-weight:750;color:var(--muted);letter-spacing:.3px;margin:16px 2px 6px;text-transform:uppercase}
.fs-row{display:flex;align-items:center;gap:10px;width:100%;padding:9px 0 9px 2px;border-bottom:1px solid var(--line);text-align:left}
.fs-row .fx{flex:1;display:flex;align-items:center;gap:10px;text-align:left;min-width:0;padding:2px 0}
.fs-row .fxt{flex:1;min-width:0}
.fs-row .fxt b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.fs-row .fxt small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.fs-row:last-child{border-bottom:0}
.fs-row .fx{flex:1;min-width:0}
.fs-row .fx b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.fs-row .fx small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.fs-row .fk{text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap;line-height:1.3}
.fs-row .fk b{display:block;color:var(--text);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.fs-row .fa{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);flex-shrink:0}
.fs-row .fa .ico{width:18px;height:18px}
.fs-row.added .fa{background:var(--ok-soft);color:var(--ok)}
.fs-empty{padding:18px 6px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.fs-done{display:flex;align-items:center;gap:8px;padding:10px 12px;margin:0 0 10px;border-radius:14px;background:var(--ok-soft);border:1px solid var(--ok-line);font-size:14px}
.fs-done .ico{color:var(--ok);flex:0 0 auto}.fs-done>span:not(.ico){flex:1}.fs-done button{color:var(--accent-ink);font-weight:700;font-size:13.5px}
.por{padding-top:2px}
.por-h{display:flex;align-items:flex-start;gap:10px}
.por-h .fx{flex:1}
.por-h b{display:block;font-size:19px;font-weight:750;line-height:1.25}
.por-h small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.por-h .star{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.por-h .star.on{color:var(--gold)}
.por-g{display:flex;align-items:center;justify-content:center;gap:12px;margin:22px 0 10px}
.por-g button{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--accent-ink)}
.por-g button .ico{width:22px;height:22px}
.por-g label{display:flex;align-items:baseline;gap:4px;border-bottom:2px solid var(--accent);padding:0 4px 2px}
.por-g input{width:110px;background:none;border:none;outline:none;text-align:center;font-size:40px;font-weight:800;letter-spacing:-1px;color:var(--text);font-variant-numeric:tabular-nums}
.por-g label span{font-size:17px;color:var(--muted);font-weight:650}
.por .chips{justify-content:center}
.por-m{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.por-m div{text-align:center;padding:10px 4px;border-radius:14px;background:var(--surface-2)}
.por-m b{display:block;font-size:17px;font-weight:750;font-variant-numeric:tabular-nums}
.por-m span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px}
.por-m .k b{color:var(--accent-ink)}.por-m .p b{color:var(--prot)}.por-m .f b{color:var(--fat)}.por-m .c b{color:var(--carb)}
.multi .ml2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.multi .ml2 small{display:block;color:var(--muted);font-size:12px}
.multi .ml2.miss{color:var(--warn)}

/* ---------- дневник ---------- */
.dsum{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px;text-align:center}
.dsum div{padding:4px 0}
.dsum b{display:block;font-size:18px;font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:374px){.dsum{grid-template-columns:1.5fr 1fr 1fr 1fr;gap:4px}.dsum b{font-size:16px}}
.dsum span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.dsum .k b{color:var(--accent-ink)}.dsum .p b{color:var(--prot)}.dsum .f b{color:var(--fat)}.dsum .c b{color:var(--carb)}
.launch{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;padding:0 16px;border-radius:17px;background:var(--surface);border:1px solid var(--line-2);color:var(--muted);font-size:16px;box-shadow:var(--sh-1);margin-bottom:12px;text-align:left}
.launch .ico{width:21px;height:21px;color:var(--accent-ink)}
.launch>span:not(.ico){flex:1}.launch>.ico{flex:0 0 auto}
.launch em{font-style:normal;font-size:12.5px;font-weight:650;color:var(--accent-ink);background:var(--accent-soft);padding:5px 9px;border-radius:9px}
h2.dh{justify-content:space-between;font-size:14px;color:var(--text)}h2.dh b{color:var(--text-2);font-size:14px}
.mg{padding:12px 0;border-bottom:1px solid var(--line)}.mg:last-child{border:none;padding-bottom:0}
.mgh{display:flex;justify-content:space-between;align-items:center;color:var(--text);font-size:15px;font-weight:700;margin-bottom:4px}
.mgh .mga{display:flex;align-items:center;gap:10px;color:var(--text-2);font-size:14px;font-variant-numeric:tabular-nums}
.mgh .mga button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)}
.mgh .mga button .ico{width:17px;height:17px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;font-size:14.5px}
.li small{display:block;margin-top:1px}
.li button{color:var(--muted);padding:7px}
.acts{display:flex}.acts button:first-child{color:var(--text-2)}
.lt{display:flex;gap:10px;align-items:center}.ph{width:42px;height:42px;border-radius:11px;object-fit:cover}
.copyy{margin:6px 0 4px;padding:10px 12px;border-radius:15px;background:var(--accent-soft);border:1px dashed var(--accent-line)}.copyy .chips{margin:6px 0 0}
.adv-ed{margin-bottom:12px}
.adv-ed>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);font-weight:650;font-size:15px}
.adv-ed>summary::-webkit-details-marker{display:none}
.adv-ed>summary .ico{color:var(--accent-ink)}
.adv-ed>summary small{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-top:1px}
.adv-ed>summary::after{content:'▾';margin-left:auto;color:var(--muted);transition:transform .2s}
.adv-ed[open]>summary{border-radius:var(--r-lg) var(--r-lg) 0 0;border-bottom-color:transparent}
.adv-ed[open]>summary::after{transform:rotate(180deg)}
.adv-ed[open]>.card{border-top-left-radius:0;border-top-right-radius:0;border-top:none;margin-bottom:0}
.adv-ed #fFav .card{border-radius:0 0 var(--r-lg) var(--r-lg);border-top:1px solid var(--line)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:230px;overflow-y:auto;margin:8px 0}
.dc{padding:10px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);text-align:left;font-size:13px;font-weight:600}
.dc small{display:block;color:var(--muted);font-size:11px;margin-top:2px;font-weight:450}
.dc.on{border-color:var(--accent-line);background:var(--accent-soft)}

/* ---------- макро-пояснения (старый блок) ---------- */

.prot-qa{margin-top:12px;display:flex;flex-direction:column;gap:8px}

/* ---------- тренировки ---------- */
.t-hero{background:linear-gradient(155deg,color-mix(in srgb,var(--gold) 13%,var(--surface)),var(--surface) 60%);border-color:var(--warn-line)}

.tpl>.ico{color:var(--muted)}
.sess{position:sticky;top:calc(6px + env(safe-area-inset-top,0px));z-index:15;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;margin:0 0 12px;border-radius:20px;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--accent-line);box-shadow:var(--sh-2)}

.sess .btn{margin:0;width:auto;min-height:44px;padding:8px 16px}
.rest{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 12px;margin:-4px 0 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.rest .rk{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:650;color:var(--muted)}
.rest .timer-val{font-size:20px;font-weight:800;color:var(--accent-ink);font-variant-numeric:tabular-nums;min-width:60px}
.rest .chips{margin:0 0 0 auto;flex-wrap:nowrap;gap:5px}
.rest .chip{min-height:32px;padding:5px 9px;font-size:12.5px}
.timer-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--accent-line);border-radius:16px;padding:10px 12px;margin-bottom:12px}
.timer-val{font-size:22px;font-weight:800;color:var(--accent-ink);font-variant-numeric:tabular-nums;min-width:62px}
.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;margin-top:10px;box-shadow:var(--sh-1)}
.ex-top{display:flex;gap:2px;align-items:center}.ex-top .inp{flex:1;min-width:0}
.ex-top .inp{font-weight:650;font-size:15.5px;background:none;border-color:transparent;padding:8px 4px}
.ex-top .inp:focus{background:var(--input);border-color:var(--accent);padding:8px 10px}
.ex-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin:2px 4px 10px;font-size:12.5px;color:var(--muted)}
.ex-prev-perf{color:var(--accent-ink);font-weight:650;cursor:pointer}
.ex-pick:empty{display:none}
.ex-pick{margin-top:8px;background:var(--surface-2);border:1px solid var(--accent-line);border-radius:13px}
.s-head{display:grid;grid-template-columns:36px 1fr 1fr 44px 32px;gap:6px;font-size:11.5px;font-weight:650;color:var(--muted);padding:0 2px;margin-bottom:2px;text-align:center}
.s-row{display:grid;grid-template-columns:36px 1fr 1fr 44px 32px;gap:6px;align-items:center;margin-top:6px}
.s-num{font-size:13px;font-weight:750;color:var(--muted);text-align:center}
.s-row .inp{padding:10px 6px;font-size:16px;font-weight:700;text-align:center;border-radius:12px}
.s-done{width:44px;height:44px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line-2);display:grid;place-items:center;color:var(--muted);transition:background .15s,transform .15s}

.s-done.on .ico svg circle{display:none}
.s-del{width:32px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.ex-eff{margin-top:8px;line-height:1.4}.ex-eff:empty{display:none}
.rep-btn{margin-top:10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.rep-btn small{font-size:12.5px;color:var(--muted);font-weight:500}
.tbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 20px + env(safe-area-inset-bottom,0px));width:calc(100% - 20px);max-width:460px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;background:color-mix(in srgb,var(--surface) 95%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--accent-line);border-radius:20px;box-shadow:var(--sh-2);z-index:25;font-size:13.5px;color:var(--text-2)}
.tbar[hidden]{display:none}
.tbar span{flex:1}
.tbar .btn{margin:0;width:auto;padding:10px 18px;min-height:44px;flex-shrink:0}
.app:has(.tbar:not([hidden])){padding-bottom:calc(var(--tab-h) + 104px + env(safe-area-inset-bottom,0px))}
.excat{margin-top:10px;background:var(--surface);border:1px solid var(--accent-line);border-radius:var(--r-lg);padding:12px;box-shadow:var(--sh-1)}
.excat-top{display:flex;justify-content:space-between;align-items:center;font-size:14.5px;font-weight:650;margin:0 2px 8px}

.excat-z,.excat-hint{margin:0 2px 8px;line-height:1.4}.excat-hint{margin:8px 2px 2px}
.excat-g{display:flex;align-items:center;gap:8px;width:100%;padding:12px;margin-top:6px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-size:14.5px;font-weight:650;color:var(--text);text-align:left}
.excat-g span{flex:1}.excat-g small{color:var(--muted);font-weight:500;font-size:12px}
.excat-g em{font-style:normal;color:var(--muted);transition:transform .2s}
.excat-g.open{border-color:var(--accent-line);background:var(--accent-soft)}.excat-g.open em{transform:rotate(180deg)}
.excat-l{display:flex;flex-direction:column;gap:2px;padding:4px 0 2px 6px}
.excat-i{display:flex;align-items:flex-start;gap:10px;width:100%;padding:10px 8px;border-radius:11px;text-align:left;font-size:14px;color:var(--text)}
.excat-i span{flex:1;line-height:1.35}.excat-i small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.excat-i i{flex-shrink:0;width:22px;height:22px;margin-top:0;border-radius:7px;border:1.6px solid var(--accent-line);background:var(--input)}

.excat-i.on i{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3.5px var(--surface)}
.excat-add{position:sticky;bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px));z-index:2}
.bm-ex{margin-top:8px}
.ws-head{display:flex;justify-content:space-between;align-items:center;width:100%;gap:10px;text-align:left;font-size:14px;font-weight:700;color:var(--text)}
.ws-head span{display:inline-flex;align-items:center;gap:6px}
.ws-head em{font-style:normal;color:var(--accent-ink);font-weight:700;font-size:13px}
.ws-sum{margin-top:8px;font-size:14px;color:var(--text-2);line-height:1.45}.ws-sum span{color:var(--muted);font-size:12.5px}
.ws-row{margin-top:10px}
.ws-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px;margin-bottom:4px}
.ws-top b{color:var(--text);font-weight:650}
.ws-top span{color:var(--muted);font-size:12px;white-space:nowrap}

.ws-bar{position:relative;height:8px;border-radius:5px;background:var(--surface-3);overflow:hidden}

.ws-bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:5px}
.ws-row.hi .ws-bar i{background:linear-gradient(90deg,#d0822f,#f08a52)}
.ws-bar u{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(111,214,239,.7) 0 3px,rgba(111,214,239,.25) 3px 6px)}
.sumw{text-align:center;padding:4px 0 6px}
.sumw .big{font-size:44px;line-height:1;margin:6px 0 2px}
.sumw h3{font-size:24px;letter-spacing:-.4px}
.sumw p{color:var(--text-2);font-size:14.5px;margin-top:4px}
.sumw-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.sumw-g div{padding:12px 4px;border-radius:15px;background:var(--surface-2)}
.sumw-g b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.sumw-g span{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-weight:600}
.prl{display:flex;flex-direction:column;gap:6px;margin:6px 0 14px;text-align:left}
.prl div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--warn-soft);border:1px solid var(--warn-line);font-size:14px}
.prl .ico{color:var(--gold)}
.cardio .chips{margin-top:0}

/* ---------- модель тела ---------- */
.bm{background:var(--fig-bg);border:1px solid var(--line);border-radius:18px;padding:10px 4px 6px}
.bm-svg{width:100%;height:auto;max-height:560px;display:block;margin:0 auto}
.bm-sil{fill:var(--fig-sil);stroke:var(--fig-line);stroke-width:1;stroke-linejoin:round}
.bm-z{cursor:pointer;outline:none}
.bm-z path{stroke:transparent;stroke-width:3px;stroke-linejoin:round;transition:fill .3s}
.bm-z.z0 path{fill:var(--fig-off)}
.bm-z.z0:hover path{fill:var(--fig-off-h)}
.bm-z.z0.sel path{fill:var(--fig-off-h)}
.bm-rec .bm-z.z1 path{fill:#8a7746}.bm-rec .bm-z.z2 path{fill:#d09a45}.bm-rec .bm-z.z3 path{fill:#e87a45}.bm-rec .bm-z.z4 path{fill:#ea5558}
.bm-load .bm-z.z1 path{fill:#22627a}.bm-load .bm-z.z2 path{fill:#2487a3}.bm-load .bm-z.z3 path{fill:#3dbbdc}.bm-load .bm-z.z4 path{fill:#7fdcf4}
/* светлая тема: фигура бежевая (светлая на светлом фоне терялась); слабые уровни зон темнее, чтобы читались на беже */
:root[data-theme="light"] .bm-rec .bm-z.z1 path{fill:#bfae6c}
:root[data-theme="light"] .bm-load .bm-z.z1 path{fill:#a9dbe9}:root[data-theme="light"] .bm-load .bm-z.z2 path{fill:#4fb8d6}:root[data-theme="light"] .bm-load .bm-z.z3 path{fill:#1f8fb3}:root[data-theme="light"] .bm-load .bm-z.z4 path{fill:#0b6584}
:root[data-theme="light"] .bm-svg pattern rect:first-child{fill:#dcc4a8}:root[data-theme="light"] .bm-svg pattern rect:last-child{fill:#9a7c5c}
.bm-z:not(.z0):hover path{filter:brightness(1.1)}
.bm-z.sel path,.bm-z:focus-visible path{stroke:var(--text);stroke-width:1.2}
.bm-card .bm .bm-empty{margin:2px 14px 8px;text-align:center;font-size:13px;line-height:1.45;color:var(--muted)}
.bm-cap{fill:var(--fig-cap);font-size:11px;letter-spacing:2.5px;font-weight:700}
.bm-leg{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--muted)}
.bm-leg span{display:inline-flex;align-items:center;gap:5px}
.bm-leg .sw{width:12px;height:12px;border-radius:50%;display:inline-block;background:var(--fig-off)}
.bm-rec .sw.z1{background:#8a7746}.bm-rec .sw.z2{background:#d09a45}.bm-rec .sw.z3{background:#e87a45}.bm-rec .sw.z4{background:#ea5558}
.bm-load .sw.z1{background:#22627a}.bm-load .sw.z2{background:#2487a3}.bm-load .sw.z3{background:#3dbbdc}.bm-load .sw.z4{background:#7fdcf4}
.bm-leg .sw.zi{background:repeating-linear-gradient(45deg,var(--fig-off) 0 2px,#5b6f86 2px 3.5px)}
:root[data-theme="light"] .bm-leg .sw.zi{background:repeating-linear-gradient(45deg,var(--fig-off) 0 2px,#9a7c5c 2px 3.5px)}
:root[data-theme="light"] .bm-rec .sw.z1{background:#bfae6c}:root[data-theme="light"] .bm-load .sw.z1{background:#a9dbe9}:root[data-theme="light"] .bm-load .sw.z2{background:#4fb8d6}:root[data-theme="light"] .bm-load .sw.z3{background:#1f8fb3}:root[data-theme="light"] .bm-load .sw.z4{background:#0b6584}
.bm-info{background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-top:10px;font-size:14px;line-height:1.5;color:var(--text)}
.bm-info .cap{display:inline-block;margin-top:3px;line-height:1.4}
.bm-top{margin-top:10px}
.bm-row{display:grid;grid-template-columns:minmax(96px,132px) 1fr 76px;gap:8px;align-items:center;font-size:13.5px;margin-top:8px;color:var(--text)}
.bm-row .bar{margin-top:0}
.bm-row b{text-align:right;font-size:13px;color:var(--accent-ink);font-weight:650;white-space:nowrap}
.bm-card.rec .bar i{background:linear-gradient(90deg,#d09a45,#ea5558)}
.bm-card.rec .bm-row b{color:var(--warn)}
.bm-card.rec .bm-row{grid-template-columns:minmax(96px,124px) 1fr 98px}
.rec-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.4}
.rec-row:first-of-type{border-top:0;padding-top:0}
.rec-row .ico{color:var(--warn);margin-top:2px}.rec-row.done .ico{color:var(--ok)}
.rec-row small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.rec-st{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 2px}
.rec-st span{font-size:12.5px;font-weight:650;padding:4px 8px;border-radius:9px}
.rec-st .wait{color:var(--warn);background:var(--warn-soft)}
.rec-st .ok{color:var(--ok);background:var(--ok-soft)}
.sum-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.sum-row:first-of-type{border-top:0;padding-top:0}
.sum-row span{color:var(--muted)}.sum-row b{font-weight:650;text-align:right}
.sum-row.ok b{color:var(--ok)}.sum-row.bad b{color:var(--warn)}

/* ---------- прогресс ---------- */
.chart-box{background:var(--surface-2);border:1px solid var(--line);border-radius:15px;padding:12px;margin-top:10px}
.chart-box svg text{fill:var(--muted)}
.stat-mini{background:var(--surface-2);border:1px solid var(--line);border-radius:15px;padding:12px}

.pr-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}

.hm{display:grid;grid-template-columns:20px repeat(13,1fr);gap:4px;align-items:center}

.bc-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 6px}.bc-g b{display:block;font-size:16px}.bc-g span{font-size:12px;color:var(--muted)}

/* ---------- профиль ---------- */

.onb-opt.on{border-color:var(--accent);background:var(--accent-soft)}.onb-opt.on b{color:var(--accent-ink)}
.onb-sx{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.onb-sx .onb-opt{flex-direction:column;justify-content:center;text-align:center;min-height:120px;gap:8px}

.brand{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;letter-spacing:1.5px;font-size:14px;color:var(--text-2);margin-top:6px}

.benefits b{display:block;font-size:15.5px}

.build{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:60vh;gap:18px}

.ss-bar{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:6px}

.ss-t{flex:1;min-width:0}
.ss-t b{display:block;font-size:15px}
.ss-t small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.ss-row>.ico{color:var(--muted);flex-shrink:0}
.ss-more{font-size:12.5px;color:var(--muted);margin-top:4px}
.ml .usual{display:inline-flex;align-items:center;gap:6px;max-width:100%;margin-top:6px;padding:5px 10px 5px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-size:12.5px;font-weight:650;text-align:left}

.fs-usual{display:flex;align-items:center;gap:12px;width:100%;margin:6px 0 2px;padding:12px 14px;border-radius:16px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--text);text-align:left}
.fs-usual .ui{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);flex-shrink:0}

.fs-usual .ut{flex:1;min-width:0}
.fs-usual .ut b{display:block;font-size:15px}

.fs-usual .uk b{display:block;font-size:16px;color:var(--text);font-variant-numeric:tabular-nums}
.ex-goal{display:flex;align-items:center;gap:10px;width:100%;margin:-2px 0 10px;padding:9px 12px;border-radius:14px;background:var(--surface-2);border:1px dashed var(--accent-line);text-align:left;color:var(--text)}
.ex-goal>.ico{color:var(--accent-ink);width:20px;height:20px;flex-shrink:0}
.ex-goal>span:not(.ico){flex:1;min-width:0}
.ex-goal b{display:block;font-size:14.5px}
.ex-goal small{display:block;font-size:12px;color:var(--muted);margin-top:1px;line-height:1.35}
.ex-goal em{font-style:normal;font-size:12px;font-weight:700;color:var(--accent-ink);flex-shrink:0}

.ex-goal.hit em{display:none}

function migrate(o) {

  const hasHistory = Object.keys(o.days || {}).length > 0;
  const prof = { ...b.profile, ...(o.profile || {}) };
  if (o.profile && o.profile.onboarded === undefined && hasHistory) prof.onboarded = true;
  const cl = (v, a, b, d) => typeof v === 'number' && isFinite(v) ? clamp(v, a, b) : d;
  prof.gender = prof.gender === 'female' ? 'female' : 'male';
  if (!GOAL_MODES[prof.goalMode]) prof.goalMode = 'lean';
  const nd = d => prof.onboarded ? d : null;   // до первого запуска поля остаются пустыми, без выдуманных значений
  prof.age = cl(prof.age, 14, 100, nd(25)); prof.height = cl(prof.height, 110, 240, nd(175));
  prof.startWeight = cl(prof.startWeight, 30, 300, nd(75)); prof.targetWeight = cl(prof.targetWeight, 30, 300, prof.startWeight);
  prof.months = cl(prof.months, .5, 60, 3); prof.activity = cl(prof.activity, 1, 2, 1.2);
  prof.activity = [1.2, 1.3, 1.4].reduce((a, x) => Math.abs(x - prof.activity) < Math.abs(a - prof.activity) ? x : a, 1.2);
  if (typeof prof.name === 'string') prof.name = prof.name.replace(/[<>"'`&]/g, '').trim().slice(0, 30); else delete prof.name;
  prof.med = (Array.isArray(prof.med) ? prof.med : []).filter((x, i, a) => ['preg', 'lact', 'kidney', 'insulin', 'ed'].includes(x) && a.indexOf(x) === i);
  /* 12.0: темп цели вместо срока в месяцах. Старый срок один раз пересчитываем в темп: если он близок (±15%) к готовому варианту — берём вариант */
  prof.paceKgW = cl(prof.paceKgW, 0, 5, 0);
  if (!PACE_IDS.includes(prof.paceId)) {
    delete prof.paceId;
    if (prof.onboarded && prof.startWeight) {
      const wk = Object.keys(o.days || {}).filter(k => o.days[k] && typeof o.days[k].weight === 'number').sort();
      const w = wk.length ? o.days[wk[wk.length - 1]].weight : prof.startWeight, diff = (prof.targetWeight || w) - w;
      if (Math.abs(diff) >= .5) {
        const P = PACE[diff < 0 ? 'loss' : 'gain'], kgw = Math.abs(diff) / (prof.months * 4.345), pct = kgw * P.wk / w * 100;
        const hit = P.opts.find(x => Math.abs(pct - x.pct) <= x.pct * .15);

    customEx: o.customEx || [],

   ========================================================= */
const PHOTO_CACHE = new Map();
let idbConn = null;

function openPhotoDb() {
  return new Promise(resolve => {
    if (idbConn) { resolve(idbConn); return; }
    if (!window.indexedDB) { resolve(null); return; }
    try {
      const req = indexedDB.open('bioforma.media', 1);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos');
      };
      req.onsuccess = e => { idbConn = e.target.result; resolve(idbConn); };
      req.onerror = () => resolve(null);
    } catch (err) { resolve(null); }
  });
}

async function idbPutPhoto(id, dataUrl) {
  PHOTO_CACHE.set(id, dataUrl);
  const conn = await openPhotoDb();
  if (!conn) return false;
  return new Promise(resolve => {
    try {
      const tx = conn.transaction('photos', 'readwrite');
      tx.objectStore('photos').put(dataUrl, id);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    } catch (e) { resolve(false); }
  });
}

async function idbDelPhoto(id) {
  PHOTO_CACHE.delete(id);
  const conn = await openPhotoDb();
  if (!conn) return;
  try {
    const tx = conn.transaction('photos', 'readwrite');
    tx.objectStore('photos').delete(id);
  } catch (e) {}
}

async function idbClearAllPhotos() {
  PHOTO_CACHE.clear();
  const conn = await openPhotoDb();
  if (!conn) return;
  try {
    const tx = conn.transaction('photos', 'readwrite');
    tx.objectStore('photos').clear();
  } catch (e) {}
}

async function initPhotosIdb() {
  const conn = await openPhotoDb();
  if (conn) {
    await new Promise(resolve => {
      try {
        const tx = conn.transaction('photos', 'readonly');
        const st = tx.objectStore('photos');
        const reqK = st.getAllKeys(), reqV = st.getAll();
        tx.oncomplete = () => {
          const ks = reqK.result || [], vs = reqV.result || [];
          ks.forEach((k, i) => PHOTO_CACHE.set(k, vs[i]));
          resolve();
        };
        tx.onerror = () => resolve();
      } catch (e) { resolve(); }
    });
  }
  /* Авто-миграция старых Base64 фото из localStorage в IndexedDB */
  let migrated = false;
  for (const k of Object.keys(db.days)) {
    const food = (db.days[k] && db.days[k].food) || [];
    for (const item of food) {
      if (item.photo && item.photo.startsWith('data:image')) {
        const pid = 'ph_' + (item.id || Date.now()) + '_' + Math.random().toString(36).slice(2, 6);
        if (await idbPutPhoto(pid, item.photo)) { item.photo = 'idb:' + pid; migrated = true; }   // не записалось — остаётся как было
      }
    }
  }
  if (migrated) save();
  if (PHOTO_CACHE.size > 0 && db.settings.tab === 'food') fDiary();
}

function resolvePhotoUrl(ref) {
  if (!ref) return '';
  if (ref.startsWith('idb:')) return PHOTO_CACHE.get(ref.slice(4)) || '';
  return ref;
}

function totals(d) {
  return (d.food || []).reduce((t, i) => ({
    kcal: t.kcal + (i.kcal || 0), rawP: t.rawP + (i.rawP || 0), bioP: t.bioP + (i.bioP || 0),
    f: t.f + (i.f || 0), c: t.c + (i.c || 0), sugar: t.sugar + (i.sugar || 0),
    drinkMl: t.drinkMl + hydroMl(i)
  }), { kcal: 0, rawP: 0, bioP: 0, f: 0, c: 0, sugar: 0, drinkMl: 0 });
}
/* 13.1: в норму воды идёт только чистая вода — кнопка «+» на Главной и записи «Вода» в питании.
   Чай, кофе, соки и другие напитки в норму не идут: решение владельца — норма воды должна значить воду
   (заодно не появляется стимул пить литры кофе: больше 400 мг кофеина в день — сверх безопасного уровня EFSA) */
const hydroMl = i => {
  if (!/^Вода(?:\s|\(|,|$)/.test(String(i.name)) || (i.kcal || 0) > 0) return 0;
  return i.ml > 0 ? i.ml : (parseInt((String(i.name).match(/\((\d+)\s*мл\)/) || [])[1], 10) || 0);
};
const ALC_RX = /(?:^|[^а-яё])(?:вин[оа]|водк|конья|виски|ром(?:\s|$|,)|джин|ликё?е?р|шампанск|текил|настойк|самогон|бренди)/i;

function latestWeight(upTo) {
  const ks = Object.keys(db.days).filter(k => k <= upTo && db.days[k] && db.days[k].weight != null).sort();
  return ks.length ? db.days[ks[ks.length - 1]].weight : (db.profile.startWeight || 78);
}
function latestWaist(upTo) {
  const ks = Object.keys(db.days).filter(k => k <= upTo && db.days[k] && db.days[k].waist != null).sort();
  return ks.length ? db.days[ks[ks.length - 1]].waist : null;   // 12.1: без замера — пусто, а не выдуманные 82 см
}

function calcIdealWeights() {
  const p = db.profile, hM = (p.height || 180) / 100, h2 = hM * hM;
  const isF = p.gender === 'female';
  const minSafe = Math.round(18.5 * h2);
  const maxHealth = Math.round(25.0 * h2);
  const idealHealth = Math.round((isF ? 21.5 : 22.5) * h2);
  const idealAthletic = Math.round((isF ? 22.5 : 24.2) * h2);
  return { minSafe, maxHealth, idealHealth, idealAthletic };
}

/* 12.2: коэффициенты нагрузки (MET) — справочник Compendium of Physical Activities 2024:
   силовая с разными упражнениями 3,5; приседания и тяги 5,0; тяжело, до отказа 6,0; свой вес 3,0, интенсивно (берпи, прыжки) 6,5.
   Лёгкая тренировка — на 15% меньше. Вычитаем 1 MET — это покой, он уже в дневной норме */
const MET_HEAVY = /^(?:Становая|Приседания со штангой|Фронтальные приседания|Приседания в машине|Гакк|Жим ногами|Выпады со штангой|Румынская тяга со штангой|Мёртвая тяга|Ягодичный мостик|Болгарские)/;
function exMet(name, il) {
  const n = String(name || '').trim(), bw = isBwEx(n), hi = /^(?:Берпи|Прыжки)/.test(n);
  let m = hi ? 6.5 : bw ? 3 : MET_HEAVY.test(n) ? 5 : 3.5;
  if (il === 0) m = Math.max(2.5, m * .85);
  else if (il === 2) m = Math.max(m, bw ? 6.5 : 6);
  return m;
}

let EX_BASE = null;
function getExCatalog() {
  // группы для чипов и фильтра берутся из таблицы зон, чтобы чипы, каталог и модель тела всегда совпадали
  if (!EX_BASE) EX_BASE = EX_RAW.map(([n, p, s, w, zs]) => { const z = zp(zs), g = zonesToGroups(z); return { n, p: g.p, s: g.s, w, z }; });
  const cust = (db.customEx || []).map(x => ({ n: x.n, p: x.p || ['chest'], s: x.s || [], w: x.w || 40, custom: true }));
  return cust.concat(EX_BASE);
}

function rxMuscles(text) {
  const raw = String(text || '').trim();
  if (!raw) return { p: [], s: [], found: false };
  const t = raw.toLowerCase();
  const cat = getExCatalog();
  const exact = cat.find(x => x.n.toLowerCase() === t);
  if (exact) return { p: [...exact.p], s: [...exact.s], found: true };

  const p = new Set(), s = new Set();
  if (/икр[ыауе]|голен|носок|носки|носкам|ослик|камбаловид|большеберц/.test(t)) p.add('calves');
  if (/жим\s*ногам|присед|выпад|гакк|фронтальн|гоблет|румынск|мертв[а-яё]*\s*тяг|ягодич|мостик|hip\s*thrust|(?:разгибан|сгибан|сведен|разведен)[а-яё]*\s*ног|квадрицепс|бицепс[а-яё]*\s*бедр/.test(t)) {
    p.add('legs');
    if (/присед|становая|румынск|мертв/.test(t)) s.add('back');
    if (/присед|выпад/.test(t)) s.add('core');
  }
  if (/станов[а-яё]*\s*тяг/.test(t)) { p.add('back'); p.add('legs'); s.add('core'); }
  if (!/узк[а-яё]*\s*хват|ногам|носкам/.test(t) && /жим[а-яё]*\s*(?:штанги\s*|гантел[а-яё]*\s*|в\s*смите\s*|в\s*тренаж[её]ре\s*|хаммер\s*)?(?:л[её]жа|на\s*наклон|под\s*углом|головой)|груд|бабочк|пек-дек|кроссовер|разводк[а-яё]*\s*гантел|пуловер/.test(t)) {
    p.add('chest');
    if (/жим|отжим|брусь/.test(t)) { s.add('arms'); s.add('shoulders'); }
  }
  if (/спин|широчайш|тяг[аиу]\s*(?:верхн|горизонт|блок|штанги|гантел|т-гриф|рычаж|хаммер|к\s*поясу|к\s*груди|в\s*наклон)|подтягив|гравитрон|гиперэкстенз|шраг|трапец/.test(t)) {
    p.add('back');
    if (/тяг|подтягив|гравитрон/.test(t)) s.add('arms');
    if (/шраг|трапец/.test(t)) s.add('shoulders');
    if (/гиперэкстенз/.test(t)) s.add('legs');
  }
  if (/плеч|дельт|армейск|жим[а-яё]*\s*(?:сидя|стоя|арнольд|вверх)|мах[иа]|протяжк|к\s*подбородк|к\s*лицу|face\s*pull|обратн[а-яё]*\s*бабочк|ротатор/.test(t)) {
    p.add('shoulders');
    if (/жим|протяжк/.test(t)) s.add('arms');
    if (/наклон|лицу|обратн/.test(t)) s.add('back');
  }
  if (/бицепс|трицепс|предплеч|молотк|французск|скотт|пюпитр|узк[а-яё]*\s*хват|из-за\s*голов|разгибан[а-яё]*\s*(?:рук|в\s*блоке|с\s*канатом)|сгибан[а-яё]*\s*(?:рук|кист)|обратн[а-яё]*\s*отжим/.test(t)) {
    p.add('arms');
    if (/узк[а-яё]*\s*хват/.test(t)) { s.add('chest'); s.add('shoulders'); }
  }
  if (/брусь|отжиман/.test(t) && !p.has('arms') && !p.has('chest')) {
    p.add('chest'); p.add('arms'); s.add('shoulders');
  }
  if (/пресс|скручив|планк|молитв|уголок|l-sit|ролик|подъ[её]м[а-яё]*\s*(?:ног|колен)|кор(?:$|[^а-яё])/.test(t)) {
    p.add('core');
  }
  p.forEach(m => s.delete(m));
  return { p: [...p], s: [...s], found: false };
}

/* разбор названия упражнения в крупные группы: каталог → похожее название → слова → старые правила */
function parseExMuscles(text) {
  const raw = String(text || '').trim();
  if (!raw) return { p: [], s: [], found: false };
  const key = normEx(raw), cat = getExCatalog(), hit = cat.find(x => normEx(x.n) === key);
  if (hit) return { p: [...hit.p], s: [...hit.s], found: true };
  const r = exZones(raw);
  if (r.how === 'none') return { p: [], s: [], found: false };
  if (r.how === 'near') { const nb = cat.find(x => x.n === r.as); if (nb) return { p: [...nb.p], s: [...nb.s], found: true }; }
  const g = zonesToGroups(r.z);
  return { p: g.p, s: g.s, found: false };
}

function lastExPerf(exName, beforeKey) {
  const target = String(exName || '').trim().toLowerCase();
  if (!target) return null;
  const keys = Object.keys(db.days).filter(k => k < beforeKey).sort().reverse();
  const allKeys = keys.concat(Object.keys(db.days).filter(k => k > beforeKey).sort().reverse());
  for (const k of allKeys) {
    const ws = (db.days[k] && db.days[k].workouts) || [];
    for (let i = ws.length - 1; i >= 0; i--) {
      const w = ws[i];
      if (!w.sets || !w.sets.length) continue;
      const matched = w.sets.filter(s => String(s.ex || '').trim().toLowerCase() === target);
      if (matched.length) {
        const parts = [];
        let firstKg = 40, firstReps = 10;
        matched.forEach((s, idx) => {
          if (Array.isArray(s.rows) && s.rows.length) {
            if (idx === 0) { firstKg = s.rows[0].kg; firstReps = s.rows[0].reps; }
            s.rows.forEach(r => parts.push(r.kg + '×' + r.reps));
          } else {
            if (idx === 0) { firstKg = s.kg || 40; firstReps = s.reps || 10; }
            parts.push(((s.sets && s.sets > 1) ? s.sets + '×' : '') + (s.kg || 0) + '×' + (s.reps || 0));
          }
        });
        return { date: dateLabel(k), text: parts.slice(0, 4).join(', '), kg: firstKg, reps: firstReps };
      }
    }
  }
  return null;
}

    for (let i = 0; i + 1 < v.length; i += 2) { const p = fn(v[i], v[i + 1]); o.push(+p[0].toFixed(1), +p[1].toFixed(1)); }

}

    const dk = shift(k, -i), d = db.days[dk];

    (d.workouts || []).forEach(w => {
      const at = workoutAt(w, dk); if (at > bs.ref) return;
      const wl = workoutLoad(w), need = zoneNeeds(wl.L, w.intense, wl.F);
      const gl = {};
      ZIDS.forEach(z => { const g = ZONES[z].g; gl[g] = Math.max(gl[g] || 0, wl.L[z] || 0); });
      const groups = Object.keys(gl).filter(g => gl[g] >= 1.5);
      if (!groups.length) return;
      const b = blocks[dk] = blocks[dk] || { dk, at, titles: [], groups: new Set(), cond: condFor(need, at, dk, k), il: 0 };
      b.il = Math.max(b.il, intLv(loadInt(wl, w.intense)));

}

/* 11.3: защитные границы цели.

let restAudio = null;
function restAudioUnlock() {

    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    if (!restAudio) restAudio = new AC();

    const o = restAudio.createOscillator(), g = restAudio.createGain();   // неслышный щелчок окончательно разблокирует звук в iOS

}
function restBeep() {

    if (!restAudio) return;

    const t0 = restAudio.currentTime + 0.02;
    [[880, 0], [1175, 0.24]].forEach(([hz, d]) => {
      const o = restAudio.createOscillator(), g = restAudio.createGain(), t = t0 + d;

      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);

}

function tickRestTimer() {

  const rem = Math.ceil((TR.timerEnd - Date.now()) / 1000);
  if (rem <= 0) {

    clearInterval(timerInterval); timerInterval = null;
    if (el) el.textContent = 'Готово!';

}

/* 12.2: время тренировки. Отмечал все подходы ✓ — от первой отметки до последней плюс отдых;

function trainMinutes(rows) {

function setsMuscles(sets) {

/* 12.2: калории силовой = время × коэффициент нагрузки подхода (Compendium 2024) × вес тела, минус покой.

function trainCalc(sets, mode, k) {

/* 12.2: прогноз восстановления под формой — вместе с тем, что уже записано за этот день (раньше считалась только эта тренировка) */
function draftReady() {
  const w = draftVirtual(), wl = workoutLoad(w), gl = {}, eff = w.eff || { warm: 0, rec: 0 };
  ZIDS.forEach(z => { const g = ZONES[z].g; gl[g] = Math.max(gl[g] || 0, wl.L[z] || 0); });
  const groups = Object.keys(gl).filter(g => gl[g] >= 1.5);

const stepBase = () => { const a = +db.profile.activity || 1.2; return a >= 1.4 ? 11000 : a >= 1.3 ? 8000 : 5000; };
function calcTrainPreview() {

    return { ...c, recSummary: rs.text, recPrior: rs.prior, eff: rs.eff };
  }
  if (TR.mode === 'cardio') {
    const cfg = W_CARDIO[TR.cType] || W_CARDIO.run, byTime = TR.cType === 'bike' || TR.cType === 'swim';
    if (!(TR.cMins > 0) || (!byTime && !(TR.cKm > 0))) return { kcal: 0, title: cfg[0], sub: byTime ? 'впиши время' : 'впиши дистанцию и время', muscles: [], recSummary: '', empty: true };

      askBox('Отмечено ' + done + ' из ' + rowsAll.length + ' подходов. Что записать?', [

  }
  const pr = sm ? trainCalc(vw.sets, TR.mode, view) : calcTrainPreview();
  const d0 = peek(view), old = TR.editId ? (d0.workouts || []).find(x => x.id == TR.editId) : null;
  const wObj = {
    id: TR.editId || Date.now(), ts: old ? old.ts : Date.now(), type: TR.mode, kv: 2,
    title: pr.title, sub: pr.sub, kcal: pr.kcal, muscles: pr.muscles, at: old ? old.at : (view === todayKey() ? Date.now() : undefined),

  };
  if (!old && !o.okDup) {
    const sig = trainSig(wObj), dup = (d0.workouts || []).find(x => trainSig(x) === sig && Date.now() - (x.ts || 0) < 15 * 60000);
    if (dup) {
      const m = Math.max(1, Math.round((Date.now() - dup.ts) / 60000));

  if (old) d.workouts[d.workouts.indexOf(old)] = wObj; else d.workouts.push(wObj);

  const nSets = sm ? wObj.sets.reduce((s, x) => s + rowsOf(x).filter(r => (+r.reps || 0) > 0).length, 0) : 0;
  const ton = sm ? Math.round(wObj.sets.reduce((s, x) => s + (isBwEx(x.ex) || TR.mode === 'bw' ? 0 : rowsOf(x).reduce((a, r) => a + (+r.kg || 0) * (+r.reps || 0), 0)), 0)) : 0;
  const sum = sm ? nSets + ' ' + ruPl(nSets, 'подход', 'подхода', 'подходов') + (ton ? ' · тоннаж ' + ton.toLocaleString('ru-RU') + ' кг' : '') : (wObj.sub || '');

/* 12.0: сколько белка «обычно» съедено к этому часу — приёмы пищи считаем равномерно с 8 до 22 ч.

function protExpected(b) { const h = new Date().getHours() + new Date().getMinutes() / 60; return Math.round(b.prot * clamp((h - 8) / 14, 0, 1)); }
/* быстрые варианты добрать белок: сначала то, что человек сам часто ест (избранное и записи за 30 дней, от 15 г белка), потом творог и протеин */

function protPicks(k) {

    if (!e || !e.name || !(e.rawP >= 15)) return;
    const s = seen.get(e.name) || { e, n: 0, ts: -1 }; s.n += w; if (ts >= s.ts) { s.e = e; s.ts = ts; } seen.set(e.name, s);
  };
  for (let i = 0; i < 30; i++) { const d = db.days[shift(k, -i)]; if (d) (d.food || []).forEach(e => add(e, 1, e.ts || 0)); }
  (db.favorites || []).forEach(f => add(f, 2, 0));
  const mine = [...seen.values()].filter(s => s.n >= 2).sort((a, c) => c.n - a.n || c.ts - a.ts).slice(0, 3).map(s => s.e);
  const defs = [quickEntry('curd'), quickEntry('drink')].filter(q => !mine.some(e => e.name === q.name));

/* когда предлагать: сразу после тренировки (за 3 часа после неё белка меньше 20 г), вечером при нехватке от 30 г,

function protRescue(k, t, b, d) {
  const need = Math.max(0, b.prot - t.rawP), now = Date.now(), s = db.settings;
  if (k !== todayKey() || need < 15) return null;
  if (db.profile.startDate === k && !(d.food || []).length) return null;   // 13.0: в день первой настройки ещё ничего не записано — это не «мало белка»
  if (s.protDay === k && now < (s.protUntil || 0)) return { snoozed: true };
  const lastW = Math.max(0, ...(d.workouts || []).map(w => w.at || 0));
  const afterW = (d.food || []).filter(e => (e.ts || 0) >= lastW).reduce((a, e) => a + (e.rawP || 0), 0);
  const h = new Date().getHours();
  let why = '';
  if (lastW && now - lastW < 3 * 3600000 && afterW < 20) why = 'После тренировки стоит съесть 20–40 г белка в ближайшие часы.';
  else if (h >= 18 && need >= 30) why = 'Вечер, а белка ещё мало — можно добрать сейчас.';   // 12.2: сколько не хватает, уже сказано выше

/* =========================================================
   ЭТАП D: ПРОГРЕСС КАК ИСТОРИЯ (СВОДКА 7 ДНЕЙ, СРЕДНИЙ ВЕС, ТАЛИЯ, РЕКОРДЫ, ОБЪЁМ ПО МЫШЦАМ, ОТДЕЛЬНЫЙ БЛОК ЦЕЛИ)
   ========================================================= */
function calcWeightAvg7(endKey) {
  let sumCur = 0, cntCur = 0, sumPrev = 0, cntPrev = 0;
  for (let i = 0; i < 7; i++) {
    const k1 = shift(endKey, -i);
    const d1 = db.days[k1];
    if (d1 && d1.weight != null) { sumCur += d1.weight; cntCur++; }
    const k2 = shift(endKey, -(i + 7));
    const d2 = db.days[k2];
    if (d2 && d2.weight != null) { sumPrev += d2.weight; cntPrev++; }
  }
  const curAvg = cntCur ? +(sumCur / cntCur).toFixed(1) : latestWeight(endKey);
  const prevAvg = cntPrev ? +(sumPrev / cntPrev).toFixed(1) : null;
  const delta7 = prevAvg != null ? +(curAvg - prevAvg).toFixed(1) : null;
  return { curAvg, cntCur, prevAvg, delta7 };
}

function calcWeeklySummary(endKey) {
  let foodDays = 0, kcalSum = 0, rawPSum = 0, bioPSum = 0;
  let waterDays = 0, waterSum = 0, waterGoalSum = 0;
  let sleepDays = 0, sleepSum = 0;
  let workoutsCount = 0, wKcalSum = 0, totalTonnage = 0;
  const mSets = { chest: 0, back: 0, legs: 0, calves: 0, shoulders: 0, arms: 0, core: 0 };
  const mTon = { chest: 0, back: 0, legs: 0, calves: 0, shoulders: 0, arms: 0, core: 0 };

  for (let i = 0; i < 7; i++) {
    const k = shift(endKey, -i);
    const d = db.days[k];
    if (!d) continue;
    const t = totals(d), b = dayBudget(k);
    if (d.food && d.food.length) {
      foodDays++;
      kcalSum += t.kcal;
      rawPSum += t.rawP;
      bioPSum += t.bioP;
    }
    if (fluidMl(d) > 0) {
      waterDays++;
      waterSum += fluidMl(d);
      waterGoalSum += b.water;
    }
    if (d.sleepH != null) {
      sleepDays++;
      sleepSum += d.sleepH;
    }
    (d.workouts || []).forEach(w => {
      workoutsCount++;
      wKcalSum += (w.kcal || 0);
      if (w.type === 'gym' && Array.isArray(w.sets)) {
        w.sets.forEach(s => {
          const parsed = parseExMuscles(s.ex || '');
          const pList = parsed.p.length ? parsed.p : (w.muscles || ['chest']).slice(0, 1);
          const sList = parsed.s || [];
          const rows = Array.isArray(s.rows) ? s.rows : [{ kg: s.kg || 0, reps: s.reps || 0 }];
          rows.forEach(r => {
            const vol = (r.kg || 0) * (r.reps || 0);
            totalTonnage += vol;
            pList.forEach(m => { if (mSets[m] != null) { mSets[m] += 1; mTon[m] += vol; } });
            sList.forEach(m => { if (mSets[m] != null) { mSets[m] += 0.5; mTon[m] += Math.round(vol * 0.35); } });
          });
        });
      } else if (w.type === 'bw') {
        (w.muscles || []).forEach((m, idx) => {
          if (mSets[m] != null) mSets[m] += (idx === 0 ? 3 : 1.5);
        });
      }
    });
  }
  return {
    foodDays,
    avgKcal: foodDays ? Math.round(kcalSum / foodDays) : 0,
    avgRawP: foodDays ? Math.round(rawPSum / foodDays) : 0,
    avgBioP: foodDays ? Math.round(bioPSum / foodDays) : 0,
    waterPct: waterGoalSum > 0 ? Math.round((waterSum / waterGoalSum) * 100) : 0,
    avgWater: waterDays ? Math.round(waterSum / waterDays) : 0,
    avgSleep: sleepDays ? +(sleepSum / sleepDays).toFixed(1) : null,
    workoutsCount,
    wKcalSum,
    totalTonnage: Math.round(totalTonnage),
    mSets,
    mTon
  };
}

function calcPersonalRecords() {
  const byEx = {};
  let bestWorkoutTon = 0, bestWorkoutDate = '';
  Object.keys(db.days).sort().forEach(k => {
    const ws = (db.days[k] && db.days[k].workouts) || [];
    ws.forEach(w => {
      if ((w.type === 'gym' || w.type === 'bw') && Array.isArray(w.sets)) {
        let wTon = 0;
        w.sets.forEach(s => {
          const name = String(s.ex || '').trim();
          if (!name) return;
          const bwx = isBwEx(name) || w.type === 'bw';
          const rows = Array.isArray(s.rows) ? s.rows : [{ kg: s.kg || 0, reps: s.reps || 0 }];
          rows.forEach(r => {
            const kg = +(r.kg || 0), reps = +(r.reps || 0);
            if (reps <= 0 || r.ef === 0) return;
            if (!bwx) wTon += kg * reps;
            const e1rm = kg > 0 && reps <= 12 ? Math.round(reps === 1 ? kg : kg * (1 + reps / 30)) : 0;
            const cur = byEx[name];
            if (!cur || kg > cur.maxKg || (kg === cur.maxKg && reps > cur.repsAtMax)) {
              byEx[name] = {
                name, bw: bwx,
                maxKg: kg,
                repsAtMax: reps,
                e1rm: Math.max(e1rm, cur ? cur.e1rm : 0),
                date: dateLabel(k)
              };
            } else if (e1rm > cur.e1rm) {
              cur.e1rm = e1rm;
            }
          });
        });
        if (wTon > bestWorkoutTon) { bestWorkoutTon = Math.round(wTon); bestWorkoutDate = dateLabel(k); }
      }
    });
  });
  const list = Object.values(byEx).sort((a, b) => b.maxKg - a.maxKg || b.e1rm - a.e1rm).slice(0, 8);
  return { list, bestWorkoutTon, bestWorkoutDate };
}

      '<span>' + line(kgw, k) + '</span><small>≈' + k.kcal + ' ккал в день · ' + o.note + '</small></button>';
  }).join('') +
    /* 13.1: свой вариант — срок в месяцах, а не кг: с той же росписью (темп, дата, калории) и объяснением, почему так */
