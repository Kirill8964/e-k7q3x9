function renderWeightSvg() {   // 13.0: масштаб по самим взвешиваниям (тренд виден), подписи без наложений, даты по краям
  const allWKeys = Object.keys(db.days).filter(k => db.days[k] && db.days[k].weight != null).sort();
  const pts = allWKeys.slice(-14).map(k => {
    const windowPts = allWKeys.filter(x => x <= k && x >= shift(k, -6)).map(x => db.days[x].weight);
    const ma = windowPts.length ? +(windowPts.reduce((a, b) => a + b, 0) / windowPts.length).toFixed(1) : db.days[k].weight;
    return { k, w: db.days[k].weight, ma };
  });
  if (!pts.length) return '<div class="chart-box"><div class="cap" style="text-align:center;padding:26px 8px">Здесь появится график, когда запишешь первое взвешивание.</div></div>';
  const hasT = db.profile.targetWeight != null, targ = db.profile.targetWeight;
  const vals = pts.map(p => p.w).concat(pts.map(p => p.ma));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const tIn = hasT && targ >= lo - 1.5 && targ <= hi + 1.5;   // цель рядом — рисуем линией, далеко — подписью у края
  if (tIn) { lo = Math.min(lo, targ); hi = Math.max(hi, targ); }
  const pad = Math.max(.4, (hi - lo) * .15); lo -= pad; hi += pad;
  const W = 340, H = 150, T = 22, B = 26, L = 14, Rr = 14, span = Math.max(.5, hi - lo);
  const X = i => pts.length === 1 ? W / 2 : Math.round(L + i * (W - L - Rr) / (pts.length - 1));
  const Y = v => Math.round(T + (hi - v) / span * (H - T - B));
  const ma = pts.map((p, i) => X(i) + ',' + Y(p.ma)).join(' ');
  const area = pts.length > 1 ? '<polygon fill="url(#wgA)" points="' + X(0) + ',' + (H - B) + ' ' + ma + ' ' + X(pts.length - 1) + ',' + (H - B) + '"/>' : '';
  const iMin = pts.reduce((a, p, i) => p.w < pts[a].w ? i : a, 0), iMax = pts.reduce((a, p, i) => p.w > pts[a].w ? i : a, 0), iLast = pts.length - 1;
  const lab = new Set([iLast, iMin, iMax]);
  const dd = k => { const d = kDate(k); return d.getDate() + ' ' + ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'][d.getMonth()]; };
  return '<div class="chart-box"><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="display:block">' +
    '<defs><linearGradient id="wgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3b567" stop-opacity=".22"/><stop offset="1" stop-color="#e3b567" stop-opacity="0"/></linearGradient></defs>' +
    (tIn ? '<line x1="' + L + '" y1="' + Y(targ) + '" x2="' + (W - Rr) + '" y2="' + Y(targ) + '" stroke="rgba(95,208,234,.4)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="' + (W - Rr) + '" y="' + (Y(targ) - 5) + '" fill="#5fd0ea" font-size="10" text-anchor="end">цель ' + kgS(targ) + '</text>' : '') +
    area +
    (pts.length > 1 ? '<polyline fill="none" stroke="rgba(95,208,234,.35)" stroke-width="1.2" points="' + pts.map((p, i) => X(i) + ',' + Y(p.w)).join(' ') + '"/>' : '') +
    (pts.length > 1 ? '<polyline fill="none" stroke="#e3b567" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" points="' + ma + '"/>' : '') +
    pts.map((p, i) => '<circle cx="' + X(i) + '" cy="' + Y(p.w) + '" r="' + (i === iLast ? 4.5 : 2.8) + '" fill="' + (i === iLast ? '#f1f5f8' : '#5fd0ea') + '"' + (i === iLast ? ' stroke="#1ca9c9" stroke-width="2"' : '') + '/>' +
      (lab.has(i) ? '<text x="' + clamp(X(i), 18, W - 18) + '" y="' + (i === iMin && i !== iLast ? Y(p.w) + 15 : Y(p.w) - 9) + '" fill="' + (i === iLast ? '#f1f5f8' : '#9aa7b1') + '" font-size="' + (i === iLast ? 11.5 : 10) + '" font-weight="' + (i === iLast ? 700 : 500) + '" text-anchor="middle">' + kgS(p.w) + '</text>' : '')).join('') +
    '<text x="' + L + '" y="' + (H - 6) + '" fill="#7f8c97" font-size="10">' + dd(pts[0].k) + '</text>' +
    (pts.length > 1 ? '<text x="' + (W - Rr) + '" y="' + (H - 6) + '" fill="#7f8c97" font-size="10" text-anchor="end">' + dd(pts[iLast].k) + '</text>' : '') +
  '</svg><div class="cap" style="text-align:center">Жёлтая — среднее за 7 дней · точки — взвешивания' + (hasT ? (tIn ? ' · пунктир — цель' : ' · цель ' + kgS(targ) + ' кг — за пределами графика') : '') + '</div></div>';
}

function renderWaistSvg() {
  const pts = Object.keys(db.days).filter(k => db.days[k] && db.days[k].waist != null).sort().slice(-14).map(k => ({ k, v: db.days[k].waist }));
  if (!pts.length) return '';
  const idealWaist = Math.round((db.profile.height || 180) * 0.5);   // 12.2: половина роста — порог риска для здоровья
  const vs = pts.map(p => p.v).concat([idealWaist]);
  const minV = Math.min(...vs) - 2, maxV = Math.max(...vs) + 2, span = Math.max(1, maxV - minV);
  const W = 340, H = 84;
  const toY = val => Math.round(H - 16 - ((val - minV) / span) * (H - 32));
  const xy = pts.map((p, i) => [pts.length === 1 ? W / 2 : Math.round(18 + i * (W - 36) / (pts.length - 1)), toY(p.v)]);
  const poly = xy.map(p => p.join(',')).join(' ');
  const idY = toY(idealWaist);
  return '<div class="chart-box"><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="86">' +
    '<line x1="10" y1="' + idY + '" x2="' + (W - 10) + '" y2="' + idY + '" stroke="rgba(227,181,103,.35)" stroke-dasharray="4 4" stroke-width="1.2"/>' +
    (xy.length > 1 ? '<polyline fill="none" stroke="#e3b567" stroke-width="2.3" points="' + poly + '"/>' : '') +
    xy.map((p, i) => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.8" fill="#e3b567"/><text x="' + p[0] + '" y="' + (p[1] - 6) + '" fill="#f6e7c8" font-size="9.5" text-anchor="middle">' + pts[i].v + ' см</text>').join('') +
  '</svg><div class="cap" style="text-align:center">Динамика талии · пунктир — половина роста (' + idealWaist + ' см): ниже — норма для здоровья</div></div>';
}

function updateProgressLive() {

/* 11.4: какие пункты дня закрыты — те же пороги, что в «Итоге дня» */
function dayChecks(k, trk) {
  const d = db.days[k];
  if (!d) return { any: false, n: 0, of: 4, w: false };
  const food = (d.food || []).length, ws = (d.workouts || []).length;
  const any = !!(food || ws || d.waterMl || d.sleepH != null || d.weight != null);
  if (!any) return { any: false, n: 0, of: 4, w: false };
  const t = totals(d), b = dayBudget(k);
  const kp = pct(t.kcal, b.kcal), pp = pct(t.rawP, b.prot), wp = pct(d.waterMl + t.drinkMl, b.water);
  const ok = { kcal: !!food && kp >= 85 && kp <= 115, prot: !!food && pp >= 90, water: wp >= 80, sleep: d.sleepH != null && d.sleepH >= 7 };
  const use = { kcal: 1, prot: 1, water: !trk || trk.water, sleep: !trk || trk.sleep };
  return { any, n: Object.keys(ok).filter(x => use[x] && ok[x]).length, of: Object.keys(use).filter(x => use[x]).length, ok, w: ws > 0 };
}
function heatmapHtml() {
  const today = todayKey(), td = kDate(today), dow = (td.getDay() + 6) % 7, start = shift(today, -dow - 7 * 12);
  const MON = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  let head = '<span></span>', prevM = -1;
  for (let c = 0; c < 13; c++) {
    const m = kDate(shift(start, c * 7)).getMonth();
    head += '<span class="hm-m">' + (m !== prevM ? MON[m] : '') + '</span>'; prevM = m;
  }
  let rows = '', full = 0, act = 0, wk = 0, days = 0;
  /* 12.2: «из скольких дней» — с первого дня записей, а не с начала сетки; вода и сон — пункты, только если ты их вообще отмечаешь */
  const anyRec = d => d && ((d.food || []).length || (d.workouts || []).length || d.waterMl || d.sleepH != null || d.weight != null);
  const firstK = Object.keys(db.days).filter(x => anyRec(db.days[x])).sort()[0] || today;
  const inGrid = Object.keys(db.days).filter(x => x >= start && x <= today);
  const trk = { water: inGrid.some(x => db.days[x] && fluidMl(db.days[x]) > 0), sleep: inGrid.some(x => db.days[x] && db.days[x].sleepH != null) };
  const WD = ['Пн', '', 'Ср', '', 'Пт', '', 'Вс'];
  for (let r = 0; r < 7; r++) {
    rows += '<span class="hm-d">' + WD[r] + '</span>';
    for (let c = 0; c < 13; c++) {
      const k = shift(start, c * 7 + r);
      if (k > today) { rows += '<span class="hm-c fut"></span>'; continue; }
      const ch = dayChecks(k, trk); if (k >= firstK) days++;
      if (ch.any) act++; if (ch.any && ch.n === ch.of) full++; if (ch.w) wk++;
      const lvl = !ch.any ? 0 : Math.max(1, Math.ceil(ch.n / ch.of * 4));
      rows += '<button class="hm-c l' + lvl + (ch.w ? ' w' : '') + (k === today ? ' now' : '') + (k === view ? ' on' : '') + '" data-a="heatday" data-v="' + k + '" aria-label="' +
        esc(dateLong(k)) + ': ' + (!ch.any ? 'записей нет' : 'закрыто пунктов ' + ch.n + ' из ' + ch.of + (ch.w ? ', тренировка' : '')) + '"></button>';
    }
  }
  return '<div class="card"><h2>' + ico('award') + ' Календарь дисциплины · 13 недель</h2>' +
    '<div class="hm">' + head + rows + '</div>' +
    '<div class="hm-leg"><span>меньше</span><i class="hm-c l1"></i><i class="hm-c l2"></i><i class="hm-c l3"></i><i class="hm-c l4"></i><span>больше</span><i class="hm-c l2 w"></i><span>тренировка</span></div>' +
    '<div class="cap" style="margin-top:8px">Дней с записями: <b>' + act + '</b> из ' + days + ' · закрыто полностью: <b>' + full + '</b> · дней с тренировкой: <b>' + wk + '</b></div>' +
    '<p><small>Яркость — сколько пунктов дня закрыто: калории (85–115% нормы), белок (от 90%), вода (от 80%), сон (от 7 ч). Вода и сон считаются, только если ты их отмечаешь. Нажми на день, чтобы открыть его.</small></p></div>';
}

/* 12.1: что не так с введённым — по-человечески; невозможное сочетание роста и веса — опечатка, ничего не считаем */
function onbCheck(v) {
  const no = x => !(x > 0);
  if (no(v.age) || no(v.height) || no(v.cur)) return 'Заполни возраст, рост и вес — здесь сразу появится расчёт калорий и БЖУ.';
  if (!(v.age >= 14 && v.age <= 100)) return 'Возраст: от 14 до 100 лет.';
  if (!(v.height >= 110 && v.height <= 240)) return 'Рост: от 110 до 240 см.';
  if (!(v.cur >= 30 && v.cur <= 300)) return 'Вес сейчас: от 30 до 300 кг.';
  const h2 = Math.pow(v.height / 100, 2), bc = v.cur / h2;
  if (bc < 12 || bc > 70) return 'Похоже на опечатку: при росте ' + v.height + ' см вес ' + v.cur + ' кг — так не бывает. Проверь рост и вес.';
  if (v.targ > 0) {
    if (!(v.targ >= 30 && v.targ <= 300)) return 'Желаемый вес: от 30 до 300 кг.';
    const bt = v.targ / h2;
    if (bt < 12 || bt > 70) return 'Похоже на опечатку в желаемом весе: ' + v.targ + ' кг при росте ' + v.height + ' см. Проверь цифру.';
  }
  return '';
}

const TR_KEY = 'bioforma.tr14';
let TR_SIG = '';
function persistTR() {

    const o = { v: 1, day: view, mode: TR.mode, sets: TR.sets, started: !!TR.started, startTs: TR.startTs || 0, intense: TR.intense, mins: TR.mins, minsManual: !!TR.minsManual,

    const s = empty ? '' : JSON.stringify(o); if (s === TR_SIG) return; TR_SIG = s;

}
function restoreTR() {
  try {
    const o = JSON.parse(localStorage.getItem(TR_KEY) || 'null'); if (!o || o.v !== 1) return;
    const num = v => v == null || v === '' ? null : (isFinite(+v) ? +v : null), tok = v => typeof v === 'string' && /^[\w-]{1,20}$/.test(v);
    TR.mode = ['gym', 'bw', 'cardio', 'steps'].includes(o.mode) ? o.mode : 'gym';
    TR.sets = (Array.isArray(o.sets) ? o.sets : []).filter(s => s && typeof s === 'object').slice(0, 40).map(s => ({ ex: String(s.ex || '').slice(0, 120),
      rows: (Array.isArray(s.rows) ? s.rows : []).filter(r => r && typeof r === 'object').slice(0, 30).map(r => { const x = { kg: num(r.kg), reps: num(r.reps), done: !!r.done }; if (num(r.dt)) x.dt = num(r.dt); return x; }) }));
    TR.drafts[TR.mode] = TR.sets;

    TR.onMuscles = (Array.isArray(o.onM) ? o.onM : []).filter(tok); TR.offMuscles = (Array.isArray(o.offM) ? o.offM : []).filter(tok);

/* конфетти — только для больших моментов; при «уменьшить движение» не показывается */

    if (matchMedia('(prefers-reduced-motion: reduce)').matches || document.hidden) return;
    const c = document.createElement('canvas'), W = innerWidth, H = innerHeight, dpr = Math.min(2, devicePixelRatio || 1);
    c.className = 'confetti'; c.setAttribute('aria-hidden', 'true'); c.width = W * dpr; c.height = H * dpr; document.body.appendChild(c);
    const x = c.getContext('2d'); x.scale(dpr, dpr);
    const cols = ['#24b3d8', '#3fd27f', '#f2c25a', '#f07068', '#a58bf7', '#6fd6ef', '#ffffff'];
    const P = Array.from({ length: n || 120 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .5, y: H * .32 + (Math.random() - .5) * 40, vx: (Math.random() - .5) * 10, vy: -Math.random() * 12 - 4,
      r: Math.random() * 6 + 5, a: Math.random() * 6.28, va: (Math.random() - .5) * .35, c: cols[Math.random() * cols.length | 0], s: Math.random() < .6 }));

}

/* ---------- замена упражнения: тренажёр занят — похожие по нагрузке на мышцы (как «Replace» в Fitbod) ---------- */
let SWAP = { idx: 0, list: [] };
function swapCands(name) {
  const z0 = exZonesC(name).z, k0 = Object.keys(z0); if (!k0.length) return [];
  const top = k0.sort((a, b) => z0[b] - z0[a])[0], n0 = Math.hypot(...k0.map(k => z0[k])), inTr = new Set((TR.sets || []).map(x => String(x.ex || '').trim().toLowerCase()).concat(String(name).trim().toLowerCase()));
  const STEMS = ['присед', 'выпад', 'жим', 'подтяг', 'тяга', 'отжим', 'подъём', 'сгибан', 'разгибан', 'развод', 'мостик', 'шраг', 'скручив', 'гиперэкст'];
  const lo = String(name).toLowerCase(), stem = STEMS.find(t => lo.includes(t)), bw0 = isBwEx(name);
  return getExCatalog().map(x => {
    if (inTr.has(x.n.toLowerCase())) return null;
    const z = exZonesC(x.n).z; if (!((z[top] || 0) >= .5)) return null;
    const ks = new Set([...k0, ...Object.keys(z)]); let dot = 0; ks.forEach(k => { dot += (z0[k] || 0) * (z[k] || 0); });
    const sim = dot / (n0 * Math.hypot(...Object.values(z)) || 1), prev = lastExPerf(x.n, view);
    const score = sim + (prev ? .1 : 0) + (stem && x.n.toLowerCase().includes(stem) ? .06 : 0) - (!bw0 && isBwEx(x.n) ? .25 : 0);   // тяжёлое не меняем на «без веса»
    return sim >= .6 ? { n: x.n, sim, prev, score, bw: !bw0 && isBwEx(x.n) } : null;
  }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 8);
}
SHEETS.exswap = () => {

/* ---------- разминка и блины для штанги (как в Strong): сколько вешать на сторону и как размяться ---------- */
const isBarbell = n => { const x = String(n || ''); return /штанг|становая тяга|EZ-гриф/i.test(x) && !/Смита|в машине/i.test(x); };
const PLATES = [20, 15, 10, 5, 2.5, 1.25];
const barKg = () => [20, 15, 10].includes(+db.settings.barKg) ? +db.settings.barKg : 20;
function platesFor(total, bar) {
  let side = Math.max(0, (total - bar) / 2); const out = [];
  PLATES.forEach(p => { while (side >= p - 1e-6) { out.push(p); side = +(side - p).toFixed(3); } });
  return { list: out, rest: side };   // rest > 0 — точно не собрать
}
function warmupFor(W, bar) {
  const r = x => Math.round(x / 2.5) * 2.5, out = [];
  if (W <= bar + 5) return out;
  out.push({ kg: bar, reps: 10 });
  [[.4, 5], [.6, 3], [.8, 2], [.9, 1]].forEach(([f, reps]) => {
    const kg = r(W * f), last = out[out.length - 1].kg;

}

}

      '<p class="cap" style="margin-top:8px">Разминку не записывай — в счёт идут только рабочие подходы. Отдых между разминочными — 1 минута.</p>' : '') };
};

/* можно ли хвалить движение веса к цели: не при особых состояниях, не подросткам и не при похудении ниже здорового ИМТ */
function weightCoachOK(dir, w) { if (medOf(db.profile).length) return false; const lim = goalLimits(w || bodyW(todayKey())); return !(lim.teen || (dir < 0 && lim.noLoss)); }
/* После взвешивания: не пугаем дневным скачком — показываем среднее, направление к цели, серию взвешиваний и новый минимум (как в Happy Scale / Libra) */

  const p = db.profile, sw = +p.startWeight, tw = +p.targetWeight, d0 = sw && tw ? (tw < sw - .5 ? -1 : tw > sw + .5 ? 1 : 0) : 0, dir = d0 && weightCoachOK(d0, v) ? d0 : 0;   // беременность, подростки, похудение ниже нормы — без «к цели» и «нового минимума»
  const w7 = calcWeightAvg7(k), parts = [];
  if (w7.cntCur >= 3 && w7.delta7 != null) {
    const toward = dir && Math.sign(w7.delta7) === dir && Math.abs(w7.delta7) >= .1;
    parts.push('среднее ' + kgS(w7.curAvg) + ' (' + (w7.delta7 > 0 ? '+' : w7.delta7 < 0 ? '−' : '±') + kgS(Math.abs(w7.delta7)) + ' за неделю' + (toward ? ', к цели' : '') + ')');
  } else if (dl != null) parts.push(dl === 0 ? 'как в прошлый раз' : (dl > 0 ? '+' : '−') + n1c(Math.abs(dl)) + ' кг к прошлому разу');
  if (dir && dl != null && Math.sign(dl) === -dir && Math.abs(dl) >= .3) parts.push('скачок за день — это вода');
  let st = 0; if (k === todayKey()) { let c = k; while (db.days[c] && db.days[c].weight != null && st < 400) { st++; c = shift(c, -1); } }
  if (st >= 3) parts.push('взвешиваний подряд: ' + st);
  const prev = Object.keys(db.days).filter(x => x !== k && db.days[x] && db.days[x].weight != null).map(x => +db.days[x].weight);
  const rec = dir && prev.length >= 5 && (dir < 0 ? v < Math.min(...prev) : v > Math.max(...prev));
  const o = { sub: parts.join(' · ') || 'Главное — среднее за неделю' };
  if (rec) { o.cele = 1; o.icon = 'award'; o.sub = (dir < 0 ? 'Новый минимум! ' : 'Новый максимум! ') + o.sub; }
  return o;

/* «Наблюдения за 4 недели» — только то, что видно в твоих записях, с порогами по числу дней (не выдумываем закономерности) */
let INS_C = null;
function insightsCalc() {
  if (INS_C && INS_C.v === DATA_V && INS_C.k === todayKey()) return INS_C.r;
  const t0 = todayKey(), out = [], days = [];
  for (let i = 1; i <= 28; i++) { const k = shift(t0, -i), d = db.days[k]; if (d && (d.food || []).length >= 2) days.push({ k, d, t: totals(d), b: dayBudget(k), wd: kDate(k).getDay() }); }
  const avg = a => a.reduce((s, x) => s + x, 0) / a.length;
  /* 1. выходные против будней */
  const we = days.filter(x => x.wd === 0 || x.wd === 6), wk = days.filter(x => x.wd > 0 && x.wd < 6);
  if (we.length >= 3 && wk.length >= 6 && !medOf(db.profile).length) {
    const df = Math.round((avg(we.map(x => x.t.kcal)) - avg(wk.map(x => x.t.kcal))) / 10) * 10;
    if (Math.abs(df) >= 250) out.push({ i: 'cal', t: 'По выходным в среднем <b>' + (df > 0 ? '+' : '−') + Math.abs(df) + ' ккал</b> к будням.', s: df > 0 ? 'Если вес стоит — дело чаще в субботе и воскресенье, а не в буднях. Попробуй спланировать один приём пищи заранее.' : 'По выходным ешь меньше — следи, чтобы не было голодных срывов в понедельник.' });
  }
  /* 2. белок на завтрак */
  const bf = days.filter(x => x.d.food.some(f => f.slot === 'breakfast'));
  if (bf.length >= 7) {
    const bp = Math.round(avg(bf.map(x => x.d.food.filter(f => f.slot === 'breakfast').reduce((s, f) => s + (f.rawP || 0), 0)))), need = Math.round(avg(bf.map(x => x.b.prot)));
    if (bp < 20 && need >= 90) out.push({ i: 'bolt', t: 'На завтрак в среднем всего <b>' + bp + ' г белка</b>.', s: 'Норма ' + need + ' г легче закрывается, если начать с 25–30 г: яйца, творог, греческий йогурт.' });
  }
  /* 3. сон и калории */
  const sl = days.filter(x => x.d.sleepH != null), lo = sl.filter(x => x.d.sleepH < 7), hi = sl.filter(x => x.d.sleepH >= 7);
  if (lo.length >= 4 && hi.length >= 4) {
    const df = Math.round((avg(lo.map(x => x.t.kcal)) - avg(hi.map(x => x.t.kcal))) / 10) * 10;
    if (df >= 150) out.push({ i: 'moon', t: 'После ночей меньше 7 часов ты ешь в среднем <b>на ' + df + ' ккал больше</b>.', s: 'Так бывает у многих: недосып усиливает аппетит. Ранний отбой — тоже часть плана.' });
  }
  /* 4. белок в дни тренировок */
  const tr = days.filter(x => (x.d.workouts || []).some(w => w.type === 'gym' || (w.sets || []).length));
  if (tr.length >= 4) {
    const ok = tr.filter(x => x.t.rawP >= x.b.prot * .9).length;
    if (ok / tr.length < .5) out.push({ i: 'dumbbell', t: 'В дни тренировок белок в норме только <b>' + ok + ' из ' + tr.length + '</b>.', s: 'Мышцы растут после тренировки — именно в эти дни белок важнее всего.' });
  }
  /* хорошее тоже замечаем — первым */
  const pos = [], l7 = days.filter(x => x.k >= shift(t0, -7));
  if (l7.length >= 5) { const ok = l7.filter(x => x.t.rawP >= x.b.prot * .9).length; if (ok >= 5) pos.push({ i: 'award', t: 'Белок в норме <b>' + ok + ' из ' + l7.length + '</b> последних дней 👏', s: 'Так мышцы сохраняются даже на дефиците — продолжай.' }); }
  const mon0 = shift(t0, -((kDate(t0).getDay() + 6) % 7)); let wks = 0;
  for (let w = 1; w <= 12; w++) { const m = shift(mon0, -7 * w); let n = 0; for (let i = 0; i < 7; i++) n += ((db.days[shift(m, i)] || {}).workouts || []).length; if (n >= 2) wks++; else break; }
  if (wks >= 3) pos.push({ i: 'flame', t: 'Тренируешься стабильно: <b>' + wks + ' ' + ruPl(wks, 'неделю', 'недели', 'недель') + ' подряд</b> по 2+ тренировки.', s: 'Регулярность важнее идеальной программы — именно она даёт результат.' });
  out.unshift(...pos.slice(0, 1)); out.push(...pos.slice(1));
  INS_C = { v: DATA_V, k: t0, r: { out, n: days.length } };
  return INS_C.r;
}
function insightsHtml() {
  const r = insightsCalc(); if (!r.out.length) return '';
  return '<div class="card ins"><div class="card-h"><h3>' + ico('sparkle') + 'Наблюдения</h3><span class="cap">' + r.n + ' ' + ruPl(r.n, 'день', 'дня', 'дней') + ' записей</span></div>' +
    r.out.slice(0, 3).map(x => '<div class="ins-r"><span class="ins-i">' + ico(x.i) + '</span><div><p>' + x.t + '</p><small>' + x.s + '</small></div></div>').join('') + '</div>';
}
